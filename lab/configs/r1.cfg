hostname r1
!
! r1 joins the lab's two networks: ws1's on GigabitEthernet1, srv1's on GigabitEthernet2.
interface GigabitEthernet1
 description ws1's network
 ip address 192.168.10.1 255.255.255.0
 no shutdown
!
interface GigabitEthernet2
 description srv1's network
 ip address 192.168.20.1 255.255.255.0
 no shutdown
!
end
